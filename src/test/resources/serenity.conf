webdriver {
  autodownload = true
  driver = chrome
}
headless.mode = false

serenity {
    project.name = CTS AutomationTest
    take.screenshots = FOR_FAILURES
#     test.root = ""
#     outputDirectory = src/target/site/reports
    reports.show.step.details = true
    report.encoding = UTF8
#     verbose.steps = true
#     console.headings = normal
#     console.colors = true
#     logging = VERBOSE
    use.unique.browser = true
    restart.browser.for.each = scenario
}
#
# Chrome options
#
chrome.switches = """--start-maximized;--test-type;--no-sandbox;--ignore-certificate-errors;
                                     --disable-popup-blocking;--disable-default-apps;--disable-extensions-file-access-check;
                                     --incognito;--disable-infobars,--disable-gpu"""

serenity.driver.capabilities="unexpectedAlertBehaviour:dismiss"


environments {
  default{
    webdriver.base.url = "https://ha.nexdev.net:7722/main"
  }
